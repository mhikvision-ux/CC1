<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Yellow Chick</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    .ui-container {
      position: absolute;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      background-color: #ffcc00;
      border: 2px solid #cc9900;
      border-radius: 8px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-container">
    <button id="btn-fly">บิน</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      
      <!-- หมุน 90 องศาแกน Y เพื่อให้หันข้าง -->
      <a-entity id="chick" rotation="0 90 0" position="0 0 0">
        
        <!-- ตัว -->
        <a-sphere color="gold" radius="0.5" position="0 0.5 0"></a-sphere>
        
        <!-- หัว -->
        <a-sphere color="gold" radius="0.35" position="0.4 0.9 0"></a-sphere>
        
        <!-- ตา -->
        <a-sphere color="black" radius="0.05" position="0.55 1 0.15"></a-sphere>
        <a-sphere color="black" radius="0.05" position="0.55 1 -0.15"></a-sphere>
        
        <!-- ปาก -->
        <a-cone color="orange" radius-bottom="0.1" height="0.3" position="0.75 0.9 0" rotation="0 0 -90"></a-cone>
        
        <!-- ปีกซ้าย -->
        <a-entity id="wing-l" position="0 0.5 0.5">
           <a-sphere color="#e6b800" radius="0.25" scale="1 0.4 0.1" position="0 0 0"></a-sphere>
        </a-entity>
        
        <!-- ปีกขวา -->
        <a-entity id="wing-r" position="0 0.5 -0.5">
           <a-sphere color="#e6b800" radius="0.25" scale="1 0.4 0.1" position="0 0 0"></a-sphere>
        </a-entity>

      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const chick = document.querySelector('#chick');
    const wingL = document.querySelector('#wing-l');
    const wingR = document.querySelector('#wing-r');
    const btn = document.querySelector('#btn-fly');
    
    let isFlying = false;

    btn.addEventListener('click', () => {
      if (!isFlying) {
        // อนิเมชันลอยตัว
        chick.setAttribute('animation', 'property: position; to: 0 1.5 0; dir: alternate; dur: 500; loop: true; easing: easeInOutSine');
        // อนิเมชันกระพือปีก
        wingL.setAttribute('animation', 'property: rotation; to: 0 0 50; dir: alternate; dur: 100; loop: true');
        wingR.setAttribute('animation', 'property: rotation; to: 0 0 -50; dir: alternate; dur: 100; loop: true');
        btn.innerText = 'หยุดบิน';
      } else {
        // ล้างอนิเมชันและรีเซ็ตตำแหน่ง
        chick.removeAttribute('animation');
        chick.setAttribute('position', '0 0 0');
        
        wingL.removeAttribute('animation');
        wingL.setAttribute('rotation', '0 0 0');
        
        wingR.removeAttribute('animation');
        wingR.setAttribute('rotation', '0 0 0');
        btn.innerText = 'บิน';
      }
      isFlying = !isFlying;
    });
  </script>

</body>
</html>
